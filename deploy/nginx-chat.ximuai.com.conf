server {
    listen 80;
    listen [::]:80;
    server_name chat.ximuai.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ximu-chat-acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://chat.ximuai.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chat.ximuai.com;

    ssl_certificate /etc/letsencrypt/live/chat.ximuai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.ximuai.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8768;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 24m;
    }
}
